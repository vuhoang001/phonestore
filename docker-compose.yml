services:
  db:
    image: postgres:16-alpine
    container_name: phonestore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phonestore
    ports:
      # Đổi cổng host để chạy song song với dự án 'hai' (5433 host → 5432 trong container)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phonestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: phonestore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-minioadmin}"
    ports:
      - "9002:9000"   # API (ảnh phục vụ tại http://localhost:9002/<bucket>/<file>)
      - "9003:9001"   # Console quản trị
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: phonestore-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=phonestore;Username=postgres;Password=postgres"
      # MinIO — Endpoint nội bộ (container), PublicEndpoint để trình duyệt tải ảnh
      Minio__Endpoint: "minio:9000"
      Minio__PublicEndpoint: "${MINIO_PUBLIC_URL:-http://localhost:9002}"
      Minio__AccessKey: "${MINIO_USER:-minioadmin}"
      Minio__SecretKey: "${MINIO_PASSWORD:-minioadmin}"
      Minio__Bucket: "phonestore"
      Minio__UseSsl: "false"
      # Bí mật JWT nên nạp từ biến môi trường/secret, không commit giá trị thật
      Jwt__Secret: "${JWT_SECRET:-CHANGE_ME_super_secret_key_at_least_32_chars_long_1234567890}"
      Jwt__Issuer: "PhoneStoreAPI"
      Jwt__Audience: "PhoneStoreClient"
      Cors__Origins__0: "http://localhost:5174"
      Cors__Origins__1: "http://localhost:8081"
      # Tài khoản admin bootstrap — nên đặt qua biến môi trường/secret, không commit mật khẩu thật
      Seed__Admin__Email: "${ADMIN_EMAIL:-admin@phone.com}"
      Seed__Admin__Password: "${ADMIN_PASSWORD:-Admin@123}"
      # VNPAY sandbox — điền TmnCode/HashSecret lấy từ https://sandbox.vnpayment.vn/devreg/
      VnPay__TmnCode: "${VNPAY_TMNCODE:-YOUR_TMNCODE}"
      VnPay__HashSecret: "${VNPAY_HASHSECRET:-YOUR_HASHSECRET}"
      VnPay__BaseUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VnPay__ReturnUrl: "http://localhost:8081/api/payments/vnpay/return"
      VnPay__FrontendReturnUrl: "http://localhost:5174/payment/result"
      VnPay__MockUrl: "http://localhost:5174/payment/mock"
      # Tự hủy đơn chưa thanh toán sau X giờ, quét mỗi Y phút
      Orders__PaymentExpiryHours: "${ORDER_EXPIRY_HOURS:-24}"
      Orders__ExpiryScanMinutes: "${ORDER_SCAN_MINUTES:-15}"
      # Email SMTP — credential nạp từ .env (KHÔNG commit). Provider=Log nếu chưa cấu hình.
      Email__Provider: "${EMAIL_PROVIDER:-Log}"
      Email__Host: "${SMTP_HOST:-smtp.gmail.com}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__EnableSsl: "true"
      Email__FromName: "PhoneStore"
      Email__FromEmail: "${SMTP_USER}"
      Email__Username: "${SMTP_USER}"
      Email__Password: "${SMTP_PASS}"
      Email__AppBaseUrl: "http://localhost:5174"
    ports:
      - "8081:8080"
    volumes:
      # Ảnh user upload lưu local & bền qua rebuild
      - uploads_data:/app/wwwroot/uploads/user

  web:
    build:
      context: ./frontend
    container_name: phonestore-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  pgdata:
  uploads_data:
  minio_data:
